# Production blueprint for Lemmer's own Render account.
# Unlike render.yaml (free demo plans), these paid plans do not sleep and the
# database does not expire. Plan IDs follow Render's Blueprint reference
# (https://render.com/docs/blueprint-spec); check current prices at
# https://render.com/pricing before applying. Deploy from the `main` branch.
#
# After applying, set in the Render dashboard (sync: false = not stored here):
#   GEMINI_API_KEY  Lemmer's own Google AI key
#   ADMIN_EMAIL, ADMIN_PASSWORD (10+ chars), ADMIN_NAME  first super-user
# Sign in as that super-user, then create the other staff accounts in the app.
# Once the first super-user exists you may delete ADMIN_PASSWORD.
databases:
  - name: lemmer-asset-passport-db
    plan: 0.1c-256mb
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: lemmer-asset-passport
    runtime: docker
    plan: 0.5c-512mb
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lemmer-asset-passport-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE      # 0 = real accounts only, no demonstration workspaces
        value: "0"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: RUST_DETECTOR
        value: local
      - key: GEMINI_API_KEY   # Lemmer's own key, entered in the Render dashboard
        sync: false
