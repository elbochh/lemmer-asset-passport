databases:
  - name: lemmer-asset-passport-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"

envVarGroups:
  - name: rust-detector-shared
    envVars:
      - key: RUST_DETECTOR_TOKEN
        generateValue: true

services:
  - type: web
    name: lemmer-asset-passport
    runtime: docker
    plan: free
    region: oregon
    branch: render-deploy
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - fromGroup: rust-detector-shared
      - key: DATABASE_URL
        fromDatabase:
          name: lemmer-asset-passport-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      # "local" runs server/models/rust_detector.onnx inside this service (no
      # second service to wake up). Set to "http" to use lemmer-rust-detector.
      - key: RUST_DETECTOR
        value: local
      - key: GEMINI_API_KEY
        sync: false
      - key: RUST_DETECTOR_URL
        fromService:
          type: web
          name: lemmer-rust-detector
          property: hostport

  - type: web
    name: lemmer-rust-detector
    runtime: docker
    plan: free
    region: oregon
    branch: render-deploy
    dockerfilePath: ./rust-service/Dockerfile
    dockerContext: ./rust-service
    healthCheckPath: /
    envVars:
      - fromGroup: rust-detector-shared
      - key: RUST_CONF
        value: "0.08"
